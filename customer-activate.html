<!doctype html>
<html lang="tr" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title data-i18n="homeCopy.products.cortex.name"></title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/customer-activation.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand"><span data-i18n="customeractivate.ui.cortex"></span></span>
        <label>
          <span class="sr-only" data-i18n="customer.activationLanguage"></span>
          <select id="activation-language">
            <option value="tr" data-i18n="language.tr"></option>
            <option value="en" data-i18n="language.en"></option>
          </select>
        </label>
      </header>
      <h1 data-i18n="customer.activationTitle"></h1>
      <p data-i18n="customer.activationIntro"></p>
      <p data-i18n="customer.activationExpiry"></p>
      <button id="activation-begin" type="button" data-i18n="customer.activationBegin"></button>
      <p id="activation-status" role="status" aria-live="polite"></p>
      <small data-i18n="customer.activationPrivacy"></small>
    </main>
    <script type="module" src="js/customer-activation.js"></script>
  </body>
</html>
