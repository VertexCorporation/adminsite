<div class="tab-panel" id="tab-scene">
  <div class="panel-section-title">
    <h2 data-i18n="catalog.scene"></h2>
  </div>
  <div class="grid-layout">
    <div class="panel-card col-span-12" id="team-log-manager" data-panel="system.teamLog" data-workspace-action="honor">
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="diversity_3"></i>
          <h3 data-i18n="team.title"></h3>
        </div>
      </div>
      <p class="intro-description" data-i18n="team.desc"></p>
      <div class="team-log-grid">
        <div class="team-log-col">
          <div id="team-mod-list" class="team-entry-list"></div>
          <div class="team-add-row">
            <input type="text" id="team-mod-input" maxlength="60" placeholder="" data-i18n-placeholder="team.name_ph" />
            <button type="button" id="team-mod-add" class="chrome-btn-outline">+</button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="panel-card col-span-12"
      id="team-cards-manager"
      data-panel="system.teamLog"
      data-workspace-action="chefs"
    >
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="badge"></i>
          <h3 data-i18n="team_cards.title"></h3>
        </div>
        <button type="button" class="chrome-btn-outline" id="add-team-card-btn">
          <i class="" data-icon="add"></i>
          <span data-i18n="team_cards.add_btn"></span>
        </button>
      </div>
      <p class="intro-description" data-i18n="team_cards.desc"></p>

      <div id="team-cards-list" class="team-list" style="margin-top: 16px"></div>
      <p id="team-cards-empty" class="state-block" data-i18n="team_cards.empty" hidden=""></p>
    </div>
    <section class="panel-card col-span-12" data-panel="system.teamLog" data-workspace-action="stars">
      <div class="card-title-row">
        <h3 data-i18n="weekly_stars.title"></h3>
      </div>
      <p data-i18n="weekly_stars.desc"></p>
      <div id="weekly-stars-container"></div>
    </section>
  </div>
</div>
