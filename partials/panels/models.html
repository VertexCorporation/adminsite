<div class="tab-panel" id="tab-models">
  <section class="panel-card col-span-12" data-panel="models.origin">
    <div class="card-title-row">
      <h3 data-i18n="origin.finance"></h3>
      <button type="button" id="origin-finance-refresh" class="btn-refresh" data-i18n="contributors.refresh"></button>
    </div>
    <div id="origin-finance" aria-live="polite"></div>
  </section>
  <div class="panel-section-title">
    <h2 data-i18n="models.title"></h2>
    <p data-i18n="models.desc"></p>
  </div>

  <div class="grid-layout">
    <!-- Model Kayıt Formu -->
    <div id="model-manager" class="panel-card col-span-7" data-panel="models.manage">
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="add_circle"></i>
          <h3 data-i18n="models.form_title"></h3>
        </div>
      </div>

      <form id="model-form" class="form-scrollable-container">
        <!-- Model Tipi Seçimi -->
        <div class="form-block-group">
          <div class="type-selector-header">
            <span class="block-title" data-i18n="models.classification"></span>
            <div class="chrome-switch-row">
              <span class="switch-label-text" data-i18n="models.roleplay"></span>
              <label class="chrome-switch">
                <input type="checkbox" id="model-type-switch" />
                <span class="slider"></span>
              </label>
              <span class="switch-label-text" data-i18n="models.offline"></span>
            </div>
          </div>

          <div class="flex-row">
            <div class="form-group-field flex-grow">
              <label for="model-producer" data-i18n="models.producer"></label>
              <input
                type="text"
                id="model-producer"
                data-i18n-placeholder="models.producer_ph"
                placeholder=""
                required=""
              />
            </div>
            <div class="form-group-field flex-grow">
              <label for="model-id" data-i18n="models.id"></label>
              <input type="text" id="model-id" data-i18n-placeholder="models.id_ph" placeholder="" required="" />
            </div>
          </div>
        </div>

        <!-- İngilizce Kart Detayları -->
        <div class="form-block-group">
          <span class="block-title" data-i18n="models.card_info"></span>
          <div class="form-group-field">
            <label for="model-title" data-i18n="models.title_field"></label>
            <input type="text" id="model-title" data-i18n-placeholder="models.title_ph" placeholder="" required="" />
          </div>
          <div class="form-group-field">
            <label for="model-summary" data-i18n="models.summary"></label>
            <textarea
              id="model-summary"
              data-i18n-placeholder="models.summary_ph"
              placeholder=""
              rows="2"
              required=""
            ></textarea>
          </div>
          <div class="form-group-field">
            <label for="model-description" data-i18n="models.description"></label>
            <textarea
              id="model-description"
              data-i18n-placeholder="models.description_ph"
              placeholder=""
              rows="3"
              required=""
            ></textarea>
          </div>
        </div>

        <!-- Rol Yapma Modeli Yönergesi -->
        <div id="roleplay-fields" class="form-block-group conditional-block">
          <span class="block-title" data-i18n="models.roleplay_config"></span>
          <div class="form-group-field">
            <label for="model-role" data-i18n="models.system_prompt"></label>
            <textarea
              id="model-role"
              data-i18n-placeholder="models.system_prompt_ph"
              placeholder=""
              rows="2"
            ></textarea>
          </div>
        </div>

        <!-- Çevrimdışı Model Özellikleri -->
        <div id="offline-fields" class="form-block-group conditional-block" style="display: none">
          <span class="block-title" data-i18n="models.offline_config">&amp;</span>
          <div class="form-group-field">
            <label for="model-url" data-i18n="models.gguf_url"></label>
            <input type="url" id="model-url" data-i18n-placeholder="models.gguf_ph" placeholder="" />
          </div>

          <div class="flex-row">
            <div class="form-group-field flex-grow">
              <label for="model-size" data-i18n="models.file_size"></label>
              <input type="number" id="model-size" data-i18n-placeholder="models.file_size_ph" placeholder="" />
            </div>
            <div class="form-group-field flex-grow">
              <label for="model-ram" data-i18n="models.ram"></label>
              <input type="number" id="model-ram" data-i18n-placeholder="models.ram_ph" placeholder="" />
            </div>
          </div>

          <div class="form-sub-section">
            <span class="sub-block-title" data-i18n="models.io_types"></span>
            <div class="flex-column">
              <div id="modalities-inputs" class="form-group-field">
                <span
                  class="sub-block-title"
                  style="font-size: 0.7rem; color: var(--text-muted)"
                  data-i18n="models.input_types"
                ></span>
                <div class="chips-checkbox-grid">
                  <label class="chip-checkbox">
                    <input type="checkbox" data-modality-type="modalities" data-modality-key="image" />
                    <span data-i18n="models.image"></span>
                  </label>
                  <label class="chip-checkbox">
                    <input type="checkbox" data-modality-type="modalities" data-modality-key="video" />
                    <span data-i18n="models.video"></span>
                  </label>
                  <label class="chip-checkbox">
                    <input type="checkbox" data-modality-type="modalities" data-modality-key="audio" />
                    <span data-i18n="models.audio"></span>
                  </label>
                  <label class="chip-checkbox">
                    <input type="checkbox" data-modality-type="modalities" data-modality-key="file" />
                    <span data-i18n="models.file"></span>
                  </label>
                </div>
              </div>
              <div id="modalities-outputs" class="form-group-field">
                <span
                  class="sub-block-title"
                  style="font-size: 0.7rem; color: var(--text-muted)"
                  data-i18n="models.output_types"
                ></span>
                <div class="chips-checkbox-grid">
                  <label class="chip-checkbox disabled">
                    <input
                      type="checkbox"
                      data-modality-type="outputs"
                      data-modality-key="text"
                      checked=""
                      disabled=""
                    />
                    <span data-i18n="models.text"></span>
                  </label>
                  <label class="chip-checkbox">
                    <input type="checkbox" data-modality-type="outputs" data-modality-key="image" />
                    <span data-i18n="models.image"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="form-sub-section">
            <span class="sub-block-title" data-i18n="models.license_section">&amp;</span>
            <div class="flex-row">
              <div class="form-group-field flex-grow">
                <label for="model-creator" data-i18n="models.creator"></label>
                <input type="text" id="model-creator" placeholder="" data-i18n-placeholder="models.creator_ph" />
              </div>
              <div class="form-group-field flex-grow">
                <label for="model-license-name" data-i18n="models.license_type"></label>
                <input
                  type="text"
                  id="model-license-name"
                  data-i18n-placeholder="models.license_type_ph"
                  placeholder=""
                />
              </div>
            </div>
            <div class="flex-row">
              <div class="form-group-field flex-grow">
                <label for="model-source-name" data-i18n="models.source"></label>
                <input type="text" id="model-source-name" value="Hugging Face" />
              </div>
              <div class="form-group-field flex-grow">
                <label for="model-license-url" data-i18n="models.license_url"></label>
                <input type="url" id="model-license-url" data-i18n-placeholder="models.license_url_ph" placeholder="" />
              </div>
            </div>
          </div>

          <div class="form-sub-section">
            <span class="sub-block-title" data-i18n="models.template_section"></span>
            <div class="form-group-field">
              <label for="model-format-template" data-i18n="models.template_select"></label>
              <select id="model-format-template">
                <option value="" data-i18n="models.template_none"></option>
                <option value="chatml" data-i18n="models.ui.chatmlQwenLlama3Etc"></option>
                <option value="llama2" data-i18n="models.ui.llama2Mistral"></option>
                <option value="alpaca" data-i18n="models.ui.alpaca"></option>
                <option value="llama3" data-i18n="models.ui.llama3"></option>
                <option value="gemma2" data-i18n="models.ui.gemma2"></option>
                <option value="anthropic-style" data-i18n="models.ui.anthropicHumanAssistant"></option>
                <option value="plain_dialogue" data-i18n="models.ui.plainDialogue"></option>
                <option value="phi-3_glm" data-i18n="models.ui.phi3Glm"></option>
              </select>
            </div>

            <div class="token-inputs-grid">
              <div class="form-group-field">
                <label for="model-token-system-start" data-i18n="models.token_system_start"></label>
                <textarea
                  id="model-token-system-start"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.system"
                ></textarea>
              </div>
              <div class="form-group-field">
                <label for="model-token-system-end" data-i18n="models.token_system_end"></label>
                <textarea
                  id="model-token-system-end"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.label"
                ></textarea>
              </div>
              <div class="form-group-field">
                <label for="model-token-user-start" data-i18n="models.token_user_start"></label>
                <textarea
                  id="model-token-user-start"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.user"
                ></textarea>
              </div>
              <div class="form-group-field">
                <label for="model-token-user-end" data-i18n="models.token_user_end"></label>
                <textarea
                  id="model-token-user-end"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.label"
                ></textarea>
              </div>
              <div class="form-group-field">
                <label for="model-token-assistant-start" data-i18n="models.token_assistant_start"></label>
                <textarea
                  id="model-token-assistant-start"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.assistant"
                ></textarea>
              </div>
              <div class="form-group-field">
                <label for="model-token-assistant-end" data-i18n="models.token_assistant_end"></label>
                <textarea
                  id="model-token-assistant-end"
                  rows="1"
                  placeholder=""
                  data-i18n-placeholder="models.ui.label"
                ></textarea>
              </div>
            </div>

            <div class="form-group-field">
              <label for="model-token-stop-generation" data-i18n="models.token_stop"></label>
              <input
                type="text"
                id="model-token-stop-generation"
                data-i18n-placeholder="models.token_stop_ph"
                placeholder=""
              />
            </div>
            <div class="form-group-field">
              <label for="model-token-ignore-regex" data-i18n="models.token_ignore"></label>
              <input
                type="text"
                id="model-token-ignore-regex"
                data-i18n-placeholder="models.token_ignore_ph"
                placeholder=""
              />
            </div>
          </div>
        </div>

        <div class="form-block-group">
          <span class="block-title" data-i18n="models.image_section"></span>
          <div class="form-group-field">
            <label for="model-image" data-i18n="models.image_label"></label>
            <input type="file" id="model-image" accept="image/*" />
          </div>
        </div>

        <div class="form-submit-row">
          <button type="submit" id="model-submit-btn" class="chrome-btn-accent">
            <span data-i18n="models.save_btn"></span>
          </button>
          <button type="button" id="model-cancel-btn" class="chrome-btn-outline" style="display: none">
            <span data-i18n="models.cancel_btn"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- Model Listeleri -->
    <div class="panel-card col-span-5" data-panel="models.library">
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="list_alt"></i>
          <h3 data-i18n="models.active_models"></h3>
        </div>
        <div class="count-chips-container">
          <span id="offline-model-count-badge" class="count-badge-indicator offline">
            <span data-i18n="models.offline_count"></span>
            0
          </span>
          <span id="roleplay-model-count-badge" class="count-badge-indicator roleplay">
            <span data-i18n="models.roleplay_count"></span>
            0
          </span>
        </div>
      </div>

      <div id="manual-models-list-container" class="scrollable-list-box-small">
        <p class="form-hint" style="text-align: center; padding: 2rem" data-i18n="models.no_models"></p>
      </div>

      <div class="card-title-row" style="margin-top: 1.5rem">
        <div class="title-details">
          <i class="" data-icon="database"></i>
          <h3 data-i18n="models.all_models"></h3>
        </div>
      </div>

      <div id="all-models-explorer" class="database-tree-box">
        <div id="all-models-list-container"></div>
      </div>
    </div>
  </div>
</div>
