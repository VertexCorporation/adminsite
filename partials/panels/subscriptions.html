<div class="tab-panel" id="tab-subscriptions">
  <section class="panel-card col-span-12" data-panel="subscriptions.assign">
    <div class="card-title-row">
      <h3 data-i18n="origin.assign"></h3>
    </div>
    <p class="form-hint" data-i18n="origin.assignHint"></p>
    <form id="origin-assignment" class="origin-assignment">
      <label>
        <span data-i18n="origin.email"></span>
        <input name="email" type="email" required="" autocomplete="off" />
      </label>
      <label>
        <span data-i18n="origin.level"></span>
        <select name="tier">
          <option data-i18n="subscriptions.ui.node"></option>
          <option data-i18n="subscriptions.ui.edge"></option>
          <option data-i18n="subscriptions.ui.graph"></option>
          <option data-i18n="subscriptions.ui.network"></option>
        </select>
      </label>
      <label>
        <span data-i18n="origin.ends"></span>
        <input name="expiry" type="datetime-local" required="" />
      </label>
      <label>
        <span data-i18n="origin.note"></span>
        <input name="note" maxlength="500" />
      </label>
      <button class="chrome-btn-primary" type="submit" data-i18n="origin.assign"></button>
      <p id="origin-assignment-status" class="form-hint" aria-live="polite"></p>
    </form>
  </section>
  <div class="panel-section-title">
    <h2 data-i18n="subs.title"></h2>
    <p data-i18n="subs.desc"></p>
  </div>

  <div class="grid-layout">
    <!-- Abonelik Atama Formu -->
    <div class="panel-card col-span-7" id="subscription-manager" data-panel="subscriptions.assign">
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="workspace_premium"></i>
          <h3 data-i18n="subs.form_title"></h3>
        </div>
      </div>
      <p class="intro-description" data-i18n="subs.form_desc"></p>

      <form id="subscription-form" class="form-stack" style="margin-top: 10px">
        <div class="flex-row">
          <div class="form-group-field flex-grow">
            <label for="sub-username" data-i18n="subs.username_label"></label>
            <div class="form-input-wrapper">
              <i class="" data-icon="person"></i>
              <input
                type="text"
                id="sub-username"
                data-i18n-placeholder="subs.username_ph"
                placeholder=""
                autocomplete="off"
              />
            </div>
            <span class="form-field-info" data-i18n="subs.username_hint"></span>
          </div>
          <div class="form-group-field flex-grow">
            <label for="sub-user-email" data-i18n="subs.email_label"></label>
            <div class="form-input-wrapper">
              <i class="" data-icon="mail"></i>
              <input
                type="email"
                id="sub-user-email"
                data-i18n-placeholder="dept.email_placeholder"
                placeholder=""
                autocomplete="off"
                required=""
              />
            </div>
            <span class="form-field-info" data-i18n="subs.email_hint"></span>
          </div>
        </div>

        <div class="flex-row">
          <div class="form-group-field flex-grow">
            <label for="sub-plan" data-i18n="subs.plan_label"></label>
            <select id="sub-plan" required=""></select>
          </div>
        </div>

        <div class="form-group-field">
          <label for="sub-end" data-i18n="subs.end_label"></label>
          <input type="datetime-local" id="sub-end" required="" />
          <span class="form-field-info" data-i18n="subs.duration_hint"></span>
        </div>

        <div class="form-submit-row">
          <button type="submit" id="assign-subscription-btn" class="chrome-btn-accent">
            <i class="" data-icon="workspace_premium"></i>
            <span data-i18n="subs.assign_btn"></span>
          </button>
        </div>
      </form>

      <!-- Toplu Tanımlama (basınca açılır; ham girdi sunucuda ayrıştırılır) -->
      <div id="sub-bulk-section" style="margin-top: 14px">
        <button
          type="button"
          id="sub-bulk-toggle"
          class="chrome-btn-outline sub-bulk-toggle"
          aria-expanded="false"
          aria-controls="sub-bulk-panel"
        >
          <i class="sub-chevron" data-icon="expand_more"></i>
          <span data-i18n="subs.bulk_toggle"></span>
        </button>
        <div id="sub-bulk-panel" class="form-stack" style="display: none; margin-top: 10px">
          <p class="intro-description" data-i18n="subs.bulk_hint"></p>
          <div class="form-group-field">
            <label for="sub-bulk-input" data-i18n="subs.bulk_label"></label>
            <textarea
              id="sub-bulk-input"
              rows="6"
              data-i18n-placeholder="subs.bulk_placeholder"
              placeholder=""
            ></textarea>
          </div>
          <div class="form-submit-row">
            <button type="button" id="sub-bulk-submit" class="chrome-btn-accent">
              <i class="" data-icon="playlist_add"></i>
              <span data-i18n="subs.bulk_btn"></span>
            </button>
          </div>
          <div id="sub-bulk-result" class="scrollable-list-box-small" style="display: none"></div>
        </div>
      </div>
    </div>

    <!-- Aktif Abonelik Listesi -->
    <div class="panel-card col-span-5" id="subscription-list-manager" data-panel="subscriptions.list">
      <div class="card-title-row">
        <div class="title-details">
          <i class="" data-icon="history"></i>
          <h3 data-i18n="subs.list_title"></h3>
        </div>
        <button
          type="button"
          id="refresh-subscriptions-btn"
          class="btn-refresh"
          data-i18n-title="subs.refresh"
          title=""
        >
          <i class="" data-icon="refresh"></i>
          <span data-i18n="subs.refresh"></span>
        </button>
      </div>
      <div class="search-input-field">
        <i class="search-icon" data-icon="search"></i>
        <input
          type="search"
          id="subscriptions-search"
          data-i18n-placeholder="subs.search"
          placeholder=""
          aria-label=""
          data-i18n-aria-label="subscriptions.ui.searchSubscriptions"
        />
      </div>
      <div id="subscriptions-list" class="dept-users-list" aria-live="polite">
        <p class="form-hint dept-list-message" data-i18n="subs.load_hint"></p>
      </div>
    </div>
  </div>
</div>
