<div class="tab-panel reports-panel" id="tab-reports">
  <div class="panel-section-title"><h2 id="reports-title" data-i18n="catalog.reports"></h2></div>
  <section class="panel-card" data-panel="reports.workspace">
    <div class="reports-toolbar">
      <div class="reports-toolbar-main">
        <div class="reports-week-controls">
          <button
            type="button"
            id="reports-prev-week"
            class="chrome-btn-outline"
            data-i18n="reports.previousWeek"
          ></button>
          <input type="date" id="reports-week" aria-label="" data-i18n-aria-label="reports.week" />
          <button type="button" id="reports-next-week" class="chrome-btn-outline" data-i18n="reports.nextWeek"></button>
        </div>
        <div class="reports-create-controls">
          <button
            type="button"
            id="reports-new-entry"
            class="chrome-btn-primary"
            data-i18n="reports.newEntry"
            hidden=""
          ></button>
          <button
            type="button"
            id="reports-new-task"
            class="chrome-btn-primary"
            data-i18n="reports.newTask"
            hidden=""
          ></button>
        </div>
      </div>
      <details class="reports-data-menu">
        <summary class="chrome-btn-outline" data-i18n="reports.dataMenu"></summary>
        <div class="reports-data-options">
          <button type="button" id="reports-export" class="chrome-btn-outline" data-i18n="reports.export"></button>
          <button type="button" id="reports-backup" class="chrome-btn-outline" data-i18n="reports.backup"></button>
          <button
            type="button"
            id="reports-restore"
            class="chrome-btn-outline"
            data-i18n="reports.restore"
            hidden=""
          ></button>
        </div>
      </details>
    </div>
    <p id="reports-access-note" class="form-hint"></p>
    <h3 id="reports-view-title"></h3>
    <div id="reports-content" aria-live="polite"></div>
  </section>
</div>
