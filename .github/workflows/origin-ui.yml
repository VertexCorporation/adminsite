name: Origin Console operation checks
on:
  workflow_dispatch:
  push:
    paths:
      - js/modules/origin.js
      - tests/origin-browser.cjs
      - .github/workflows/origin-ui.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node tests/origin-browser.cjs
