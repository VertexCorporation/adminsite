name: console ui verification
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    paths:
      - 'css/**'
      - 'l10n/**'
      - 'partials/**'
      - 'scripts/**'
      - 'js/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/console-ui.yml'
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:syntax
      - run: npm run check:architecture
      - run: npm run check:localization
      - run: npm run audit:i18n
      - run: npm run build
      - run: npm run verify:release
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/architecture-browser.cjs
      - run: node tests/reports-browser.cjs
      - run: node tests/ui-browser.cjs
      - run: node tests/catalog-browser.cjs
      - run: node tests/list-refresh-browser.cjs
      - name: Full legacy application browser regression
        run: npm run test:browser
        env:
          VERTEX_BROWSER: chromium
