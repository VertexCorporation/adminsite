name: console immutable release snapshot

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'assets/fonts/ubuntu-medium.ttf'
      - 'firebase-config.json'
      - 'scripts/release.cjs'
      - '.github/workflows/console-release-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: console-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax before publishing immutable assets
        run: node scripts/check-syntax.cjs
      - name: Generate content-addressed assets using existing release script
        run: node scripts/release.cjs
      - name: Verify source, hash and every immutable asset match
        run: node scripts/verify-release.cjs
      - name: Verify generated import map and assets
        shell: bash
        run: |
          set -euo pipefail
          release=$(node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=html.match(/name=\\\"vertex-release\\\" content=\\\"([a-f0-9]{12})\\\"/);if(!m)process.exit(1);process.stdout.write(m[1])")
          test -s "assets/releases/$release/js/core/firebase.js"
          test -s "assets/releases/$release/js/modules/contributors.js"
          test -s "assets/releases/$release/js/modules/roles.js"
          echo "Published release candidate: $release"
      - name: Commit and push a verified snapshot from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Other agents may push between checkout and publication. Never
          # push an old manifest or force-update main: refresh and rebuild.
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            node scripts/check-syntax.cjs
            node scripts/release.cjs
            node scripts/verify-release.cjs
            git add index.html assets/releases/
            if git diff --cached --quiet; then
              echo 'Latest main already has the verified immutable release.'
              exit 0
            fi
            git commit -m 'chore(console): publish content-addressed frontend release'
            if git push origin HEAD:main; then
              echo 'Published verified snapshot of current main.'
              exit 0
            fi
            echo "Concurrent main update during snapshot publication (attempt ${attempt}/5); refreshing source and rebuilding."
            sleep 2
          done
          echo 'Snapshot publication still racing after 5 safe retries.' >&2
          exit 1
