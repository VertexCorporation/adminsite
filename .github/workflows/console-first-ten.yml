name: console first ten checks
on:
  push:
    branches: [fix/console-first-ten-20261017]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:i18n
      - run: npm run test:startup
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/honor-browser.cjs
      - run: npm run test:browser
