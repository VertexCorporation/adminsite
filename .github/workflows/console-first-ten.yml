name: console first ten checks
on:
  push:
    branches: [fix/console-first-ten-20261017]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
      - run: node -e "if(require('playwright/package.json').version!=='1.62.1')process.exit(1)"
      - name: Run first-ten independent unit regressions
        run: node --test tests/callable-read.test.cjs tests/callable.test.cjs tests/contributor-edit.test.cjs tests/contributor-state.test.cjs tests/email-template-links.test.cjs tests/email-template-validation.test.cjs tests/i18n.test.cjs tests/people-startup.test.cjs
      - run: npm run audit:i18n
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
      - run: node -e "if(require('playwright/package.json').version!=='1.62.1')process.exit(1)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:startup
      - run: node tests/honor-browser.cjs
      - run: npm run test:browser
