<!DOCTYPE html>
<html lang="{{LANGUAGE}}">
<head>
    <meta charset="utf-8">
    <style>
        @font-face { font-family: 'Ubuntu'; font-weight: 700; src: url('{{FONT_DATA_URL}}') format('truetype'); }
        @page { size: 2000px 1414px; margin: 0; }
        body, html { margin: 0; padding: 0; width: 2000px; height: 1414px; font-family: 'Ubuntu', Arial, sans-serif; background-color: #ffffff; overflow: auto; }
        .certificate-container { width: 100%; height: 100%; background-image: url('{{BACKGROUND_DATA_URL}}'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; position: relative; }
        .name-box { position: absolute; top: 43%; left: 50%; transform: translate(-50%, -50%); width: 80%; text-align: center; }
        .name-text { color: {{FOREGROUND}}; font-size: 64pt; font-weight: 700; letter-spacing: 2px; white-space: nowrap; }
        .date-box { position: absolute; bottom: 356px; left: 562px; transform: translateX(-50%); text-align: center; }
        .date-text { color: {{FOREGROUND}}; font-size: 32pt; font-weight: 700; }
        .qr-box { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 144px; height: 144px; background-color: #fff; padding: 10px; border-radius: 8px; border: 2px solid {{QR_BORDER}}; }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="certificate-container">
        <div class="name-box"><div class="name-text">{{NAME}}</div></div>
        <div class="date-box"><div class="date-text">{{FORMATTED_DATE}}</div></div>
        <div class="qr-box"><img src="{{QR_DATA_URL}}" alt="Verification QR Code"></div>
    </div>
</body>
</html>
