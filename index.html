    <script>
        // Favicons follow the browser preference, independently of the console theme.
        (function () {
            const browserTheme = window.matchMedia('(prefers-color-scheme: dark)');
            const lightIcon = document.getElementById('vertex-favicon');
            const darkIcon = document.getElementById('vertex-favicon-dark');
            const sync = () => {
                lightIcon.media = browserTheme.matches ? 'not all' : 'all';
                darkIcon.media = browserTheme.matches ? 'all' : 'not all';
            };
            sync();
            if (browserTheme.addEventListener) browserTheme.addEventListener('change', sync);
            else if (browserTheme.addListener) browserTheme.addListener(sync);
        })();
        // Sayfa yüklenmeden önce localStorage'dan temayı ayarlayan betik
        (function () {
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'system') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) {
                console.error("localStorage'dan tema ayarlanamadı", e);
            }
        })();
    </script>
