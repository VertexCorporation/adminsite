<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="page.title"></title>
    <script type="module" src="js/lang.js"></script>

    <!-- SEO & Basic Meta -->
    <meta
      name="description"
      data-i18n="page.desc"
      content="Vertex içerikleri, kullanıcı yönetimi ve sistem yönetimi için merkezi kontrol paneli."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F0F10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="canonical" href="https://admin.vertexishere.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vertex Konsol" />
    <meta property="og:description" content="Vertex Corporation yönetim konsolu." />
    <meta property="og:image" content="https://admin.vertexishere.com/assets/vertex-konsol-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://admin.vertexishere.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vertex Konsol" />
    <meta name="twitter:image" content="https://admin.vertexishere.com/assets/vertex-konsol-og.png" />
    <!-- Favicons -->
    <link
      id="vertex-favicon"
      rel="icon"
      href="assets/favicon-light.svg?v=2"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="vertex-favicon-dark"
      rel="icon"
      href="assets/favicon-dark.svg?v=2"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/modules.css" />
    <link rel="stylesheet" href="css/certificates.css" />
    <link rel="stylesheet" href="css/layout/interaction.css" />

    <script>
      // Favicons follow the browser preference, independently of the console theme.
      (function () {
        const browserTheme = window.matchMedia('(prefers-color-scheme: dark)');
        const lightIcon = document.getElementById('vertex-favicon');
        const darkIcon = document.getElementById('vertex-favicon-dark');
        const sync = () => {
          lightIcon.media = browserTheme.matches ? 'not all' : 'all';
          darkIcon.media = browserTheme.matches ? 'all' : 'not all';
        };
        sync();
        if (browserTheme.addEventListener) browserTheme.addEventListener('change', sync);
        else if (browserTheme.addListener) browserTheme.addListener(sync);
      })();
      // Sayfa yüklenmeden önce localStorage'dan temayı ayarlayan betik
      (function () {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'light' || theme === 'system') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          console.error("localStorage'dan tema ayarlanamadı", e);
        }
      })();
    </script>
    <script>
      // Alan adı kontrolü
      var requiredDomain = 'admin.vertexishere.com';
      var currentDomain = window.location.hostname;
      if (currentDomain !== requiredDomain && currentDomain !== 'localhost' && currentDomain !== '127.0.0.1') {
        window.location.replace('https://' + requiredDomain + window.location.pathname + window.location.search);
      }
    </script>
    <link rel="stylesheet" href="css/modules/people.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/ui/controls.css" />
    <link rel="stylesheet" href="css/ui/overlay.css" />
    <link rel="stylesheet" href="css/ui/toast.css" />
    <link rel="stylesheet" href="css/ui/scroll.css" />
    <link rel="stylesheet" href="css/ui/layout.css" />
    <link rel="stylesheet" href="css/modules/catalog-layout.css" />
    <link rel="stylesheet" href="css/reports.css" />
  </head>

  <body>
    <!-- Başlatıcı Yükleme Ekranı -->
    <div id="app-loader" class="vx-app-loader" role="status" data-i18n-aria-label="common.loading" aria-label="">
      <div class="vx-loader-mark" aria-hidden="true">
        <img class="vx-loader-logo vx-loader-base" src="assets/vertex-logo.svg" alt="" />
        <img class="vx-loader-logo vx-loader-sweep" src="assets/vertex-logo.svg" alt="" />
      </div>
      <span class="sr-only" data-i18n="common.loading"></span>
    </div>

    <!-- Hızlı Toast Bildirim Alanı -->
    <div id="toast-container"></div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-container" class="container">
      <div class="login-box">
        <div class="login-header">
          <div class="logo-orb">
            <img src="assets/vertex-logo.svg" class="vertex-brand-logo" width="32" height="32" alt="" />
          </div>
          <h1 data-i18n="login.title"></h1>
        </div>

        <form id="login-form" class="form-wrapper" novalidate="">
          <div class="input-field">
            <svg class="prefix-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
              ></path>
            </svg>
            <input
              type="email"
              id="email"
              data-i18n-aria-label="login.email"
              data-i18n-placeholder="login.email"
              placeholder=""
              autocomplete="email"
              required=""
            />
          </div>

          <div class="input-field">
            <svg class="prefix-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
              ></path>
            </svg>
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              data-i18n-aria-label="login.password"
              data-i18n-placeholder="login.password"
              placeholder=""
              required=""
            />
          </div>

          <button id="login-btn" type="submit" class="chrome-btn-primary">
            <span data-i18n="login.btn"></span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-left: 8px">
              <path
                d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"
              ></path>
            </svg>
          </button>
        </form>

        <div class="divider">
          <span data-i18n="login.or"></span>
        </div>

        <div class="social-login-grid">
          <button id="google-login-btn" class="chrome-social-btn google" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path
                fill="currentColor"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              ></path>
              <path
                fill="currentColor"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              ></path>
              <path
                fill="currentColor"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              ></path>
              <path
                fill="currentColor"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              ></path>
            </svg>
            <span><span data-i18n="index.ui.google"></span></span>
          </button>
          <button id="apple-login-btn" class="chrome-social-btn apple" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path
                d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
              ></path>
            </svg>
            <span><span data-i18n="index.ui.apple"></span></span>
          </button>
        </div>
      </div>
    </div>

    <!-- ANA PANEL (FULLSCREEN SHELL) -->
    <div id="admin-panel" class="app-layout" style="display: none">
      <!-- ÜST BAŞLIK (SABİT HEADER) -->
      <header class="app-header">
        <button
          id="nav-toggle"
          type="button"
          class="icon-action-btn"
          aria-label=""
          data-i18n-aria-label="navigation.main"
          aria-controls="navigation-tabs-dock"
          aria-expanded="false"
        >
          <i data-icon="menu"></i>
        </button>
        <span class="topbar-page-title"></span>
        <div class="header-control-buttons topbar-actions">
          <div id="user-menu-root"></div>
          <button
            id="lang-toggle-btn"
            class="topbar-select-btn"
            aria-haspopup="dialog"
            data-i18n-title="language.select"
            aria-label=""
            data-i18n-aria-label="language.select"
          >
            <i data-icon="language"></i>
            <span id="lang-indicator"><span data-i18n="language.tr"></span></span>
          </button>
          <button
            id="theme-menu-btn"
            class="topbar-select-btn"
            aria-haspopup="dialog"
            data-i18n-title="header.theme"
            title=""
          >
            <i data-icon="sun"></i>
            <span class="topbar-select-label"></span>
          </button>
          <button id="logout-btn" class="btn-sign-out">
            <i class="" data-icon="logout"></i>
            <span data-i18n="header.logout"></span>
          </button>
        </div>
      </header>

      <!-- ORTAK HİBRİT NAVİGASYON (MOBİLDE ALT BAR, DESKTOPTA SOL SIDEBAR) -->
      <template data-fragment="navigation"></template>

      <!-- İÇERİK ALANI -->
      <main class="app-main">
        <div class="tab-scroll-container" id="tab-scroll-container">
          <!-- VERTEX KONSOL EV / DİJİTAL ORYANTASYON -->
          <template data-fragment="panels/home"></template>

          <template data-fragment="panels/origin"></template>
          <template data-fragment="panels/users"></template>
          <template data-fragment="panels/publications"></template>
          <template data-fragment="panels/scene"></template>
          <template data-fragment="panels/reports"></template>
          <!-- SEKME 1: ADAYLAR -->
          <template data-fragment="panels/contributors"></template>

          <!-- SEKME 2: MODEL KÜTÜPHANESİ -->
          <template data-fragment="panels/models"></template>

          <!-- SEKME 3: HABERLER VE DUYURULAR -->

          <!-- SEKME 4: BİLDİRİM YÖNETİMİ -->

          <!-- SEKME 5: SİSTEM VE SUNUCU -->
          <template data-fragment="panels/system"></template>

          <template data-fragment="panels/chat"></template>
          <template data-fragment="panels/subscriptions"></template>
          <template data-fragment="panels/profile"></template>
        </div>
      </main>
    </div>

    <!-- Firebase SDK ve Entegrasyon Modülleri -->
    <script type="module" src="js/core/bootstrap.js"></script>
  </body>
